name: AOT Publish

on:
  # 手动跑一次完整 AOT 发布（产物见 Actions artifact）
  workflow_dispatch:
  # 推送 v* tag 时同样发布，并把 zip 附加到 GitHub Release
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_CLI_UI_LANGUAGE: en
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish-aot:
    name: Native AOT publish (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # 后台守护程序是 C++ 工程（本机 VS2026 / v145；GitHub 运行器当前同为 windows-2025-vs2026）。
      # 先按工程自带工具集构建，失败再回退 v143；即使构建不出来也不影响主程序 AOT 产物。
      - name: Build C++ background helper (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1
          Write-Host "MSBuild: $msbuild"
          $proj = 'src\CommandPark.Background.Cpp\CommandPark.Background.Cpp.vcxproj'

          & $msbuild $proj /p:Configuration=Release /p:Platform=x64 /m /v:minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Warning '默认工具集构建失败，回退 v143 重试'
            & $msbuild $proj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m /v:minimal
          }

          if ($LASTEXITCODE -eq 0) {
            Get-ChildItem src\CommandPark.Background.Cpp\bin -Recurse -Filter *.exe |
              Select-Object FullName, Length | Format-Table
          }

      - name: Native AOT publish
        shell: pwsh
        run: |
          dotnet publish src/CommandPark.Ui/CommandPark.Ui.csproj `
            -c Release -r win-x64 `
            -p:PublishAot=true -p:SelfContained=true `
            -o publish/aot 2>&1 | Tee-Object -FilePath aot-publish.log
          exit $LASTEXITCODE

      - name: AOT warning summary
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path aot-publish.log)) { exit 0 }
          $warnings = Select-String -Path aot-publish.log -Pattern 'warning IL\d+' -AllMatches
          "### Native AOT warnings: $($warnings.Count)" | Add-Content $env:GITHUB_STEP_SUMMARY
          $warnings | ForEach-Object { $_.Line -replace '^.*warning ', 'warning ' } |
            Sort-Object -Unique | ForEach-Object { "- ``$_``" } | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload AOT publish log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aot-publish-log
          path: aot-publish.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Package (without PDBs)
        shell: pwsh
        run: |
          Get-ChildItem publish\aot | Select-Object Name, Length | Format-Table
          $files = Get-ChildItem publish\aot -File | Where-Object { $_.Extension -ne '.pdb' }
          Compress-Archive -Path $files.FullName -DestinationPath CommandPark-win-x64-aot.zip -Force
          Get-Item CommandPark-win-x64-aot.zip | Format-Table Name, Length

      - name: Upload AOT artifact
        uses: actions/upload-artifact@v7
        with:
          name: CommandPark-win-x64-aot
          path: CommandPark-win-x64-aot.zip
          retention-days: 14

      - name: Create/Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" CommandPark-win-x64-aot.zip --clobber --repo "${{ github.repository }}"