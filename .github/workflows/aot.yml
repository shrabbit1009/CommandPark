name: AOT Publish

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 同时创建 GitHub Release（仅在 tag 上推送时生效）
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_CLI_UI_LANGUAGE: en
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish-aot:
    name: Native AOT publish (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 后台守护程序是 C++ 工程（本机用 VS2026 的 v145 工具集），
      # GitHub 运行器上只有 VS2022 的 v143，因此这里显式指定工具集；
      # 即使构建失败也不影响主程序 AOT 产物。
      - name: Build C++ background helper (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1
          Write-Host "MSBuild: $msbuild"
          & $msbuild src\CommandPark.Background.Cpp\CommandPark.Background.Cpp.vcxproj `
            /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m /v:minimal

      - name: Native AOT publish
        run: >
          dotnet publish src/CommandPark.Ui/CommandPark.Ui.csproj
          -c Release -r win-x64
          -p:PublishAot=true -p:SelfContained=true
          -o publish/aot

      - name: Package (without PDBs)
        shell: pwsh
        run: |
          $files = Get-ChildItem publish\aot -File | Where-Object { $_.Extension -ne '.pdb' }
          Compress-Archive -Path $files.FullName -DestinationPath CommandPark-win-x64-aot.zip -Force
          Get-Item CommandPark-win-x64-aot.zip | Format-Table Name, Length

      - name: Upload AOT artifact
        uses: actions/upload-artifact@v4
        with:
          name: CommandPark-win-x64-aot
          path: CommandPark-win-x64-aot.zip
          retention-days: 14

      - name: Create/Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" CommandPark-win-x64-aot.zip --clobber --repo "${{ github.repository }}"