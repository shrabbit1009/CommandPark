name: Release (AOT + installer)

on:
  # 手动跑一次完整发布（AOT 产物 + 安装程序，见 Actions artifact）
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（数字点分，如 1.2.3，最多四段）。留空时：tag 构建取 tag，其余取 0.0.0"
        required: false
        default: ""
  # 推送 v* tag 时同样发布，并把产物附加到 GitHub Release
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_CLI_UI_LANGUAGE: en
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish-aot:
    name: Release build (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # 后台守护程序是 C++ 工程（本机 VS2026 / v145；GitHub 运行器当前同为 windows-2025-vs2026）。
      # 先按工程自带工具集构建，失败再回退 v143；即使构建不出来也不影响主程序 AOT 产物。
      - name: Build C++ background helper (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1
          Write-Host "MSBuild: $msbuild"
          $proj = 'src\CommandPark.Background.Cpp\CommandPark.Background.Cpp.vcxproj'

          & $msbuild $proj /p:Configuration=Release /p:Platform=x64 /m /v:minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Warning '默认工具集构建失败，回退 v143 重试'
            & $msbuild $proj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m /v:minimal
          }

          if ($LASTEXITCODE -eq 0) {
            Get-ChildItem src\CommandPark.Background.Cpp\bin -Recurse -Filter *.exe |
              Select-Object FullName, Length | Format-Table
          }

      - name: Native AOT publish
        shell: pwsh
        run: |
          dotnet publish src/CommandPark.Ui/CommandPark.Ui.csproj `
            -c Release -r win-x64 `
            -p:PublishAot=true -p:SelfContained=true `
            -o publish/aot 2>&1 | Tee-Object -FilePath aot-publish.log
          exit $LASTEXITCODE

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          if (-not $version) { $version = '${{ github.event.inputs.version }}' }
          if (-not $version) { $version = '0.0.0' }
          if ($version -notmatch '^\d+(\.\d+){0,3}$') {
            throw "版本号必须是数字点分（最多四段），例如 1.2.3；当前是 '$version'"
          }
          Write-Host "版本号: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 安装失败' }

      # 压缩包版 + 安装程序：都用同一份 publish 目录，脚本里排除 *.pdb、
      # 保留 lang\ 与 licenses\ 的目录结构（细节见 installer\build.ps1）
      - name: Package zip + installer
        shell: pwsh
        run: |
          pwsh -NoProfile -File installer\build.ps1 `
            -Version ${{ steps.version.outputs.version }} `
            -SkipPublish `
            -PublishDir publish/aot `
            -OutputDir publish/installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem publish/installer | Select-Object Name, Length | Format-Table

      - name: AOT warning summary
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path aot-publish.log)) { exit 0 }
          $warnings = Select-String -Path aot-publish.log -Pattern 'warning IL\d+' -AllMatches
          "### Native AOT warnings: $($warnings.Count)" | Add-Content $env:GITHUB_STEP_SUMMARY
          $warnings | ForEach-Object { $_.Line -replace '^.*warning ', 'warning ' } |
            Sort-Object -Unique | ForEach-Object { "- ``$_``" } | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload AOT publish log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aot-publish-log
          path: aot-publish.log
          if-no-files-found: ignore
          retention-days: 14

      # 安装程序与压缩包内容一致，只是一个装进系统、一个解压即用
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CommandPark-win-x64
          path: publish/installer/CommandPark-*
          if-no-files-found: error
          retention-days: 14

      - name: Create/Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" publish/installer/CommandPark-* --clobber --repo "${{ github.repository }}"