name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_CLI_UI_LANGUAGE: en
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore src/CommandPark.Ui/CommandPark.Ui.csproj
          dotnet restore src/CommandPark.Tests/CommandPark.Tests.csproj

      - name: Build UI (Release)
        run: dotnet build src/CommandPark.Ui/CommandPark.Ui.csproj -c Release --no-restore

      - name: Test
        run: dotnet test src/CommandPark.Tests/CommandPark.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore
          retention-days: 7

      # 仅报告 AOT/裁剪风险（IL2026/IL2050/IL3002/IL3053…），不阻断 CI，日志见 artifact。
      - name: AOT/trimming analyzer report
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build src/CommandPark.Ui/CommandPark.Ui.csproj -c Release -t:Rebuild `
            -p:EnableAotAnalyzer=true -p:EnableTrimAnalyzer=true -p:EnableSingleFileAnalyzer=true `
            2>&1 | Tee-Object -FilePath aot-analyzer.log
          exit 0

      - name: Upload analyzer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aot-analyzer-log
          path: aot-analyzer.log
          if-no-files-found: ignore
          retention-days: 7