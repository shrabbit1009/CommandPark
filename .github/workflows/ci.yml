name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_CLI_UI_LANGUAGE: en
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore src/CommandPark.Ui/CommandPark.Ui.csproj
          dotnet restore src/CommandPark.Tests/CommandPark.Tests.csproj

      - name: Build UI (Release)
        run: dotnet build src/CommandPark.Ui/CommandPark.Ui.csproj -c Release --no-restore

      # src\CommandPark.Background 是早期 C# 原型（发布包里不包含，真正的后台是 C++ 那个）。
      # UI 已经不再引用它，这里单独编译一次，避免它悄悄烂掉。
      - name: Build managed background prototype (Release)
        run: dotnet build src/CommandPark.Background/CommandPark.Background.csproj -c Release

      - name: Test
        run: dotnet test src/CommandPark.Tests/CommandPark.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore
          retention-days: 7

      # 只报告 AOT / 裁剪风险（IL2xxx、IL3xxx），不阻断 CI；结果写入 Job Summary 并留档。
      - name: AOT/trimming analyzer report
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build src/CommandPark.Ui/CommandPark.Ui.csproj -c Release -t:Rebuild `
            -p:EnableAotAnalyzer=true -p:EnableTrimAnalyzer=true -p:EnableSingleFileAnalyzer=true `
            2>&1 | Tee-Object -FilePath aot-analyzer.log

          $warnings = Select-String -Path aot-analyzer.log -Pattern 'warning IL\d+' -AllMatches
          "### AOT/trimming warnings: $($warnings.Count)" | Add-Content $env:GITHUB_STEP_SUMMARY
          $warnings | ForEach-Object { $_.Line -replace '^.*warning ', 'warning ' } |
            Sort-Object -Unique | ForEach-Object { "- ``$_``" } | Add-Content $env:GITHUB_STEP_SUMMARY
          exit 0

      - name: Upload analyzer log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aot-analyzer-log
          path: aot-analyzer.log
          if-no-files-found: ignore
          retention-days: 7